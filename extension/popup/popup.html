<!doctype html>
<meta charset="utf-8">
<title>RiftAtlas Replay</title>
<link rel="stylesheet" href="popup.css">
<header>
  <strong>RiftAtlas Replay</strong>
  <span id="version" title="The version currently loaded. If a fix has not taken effect, check this first."></span>
  <button id="library" title="Every game in one place: results, mulligans, sideboarding, and your marks and notes.">Library</button>
  <button id="import" title="Add a .ratlas.json file to this list — one you exported, or one someone sent you — so you can watch it in RiftAtlas' board and mark it up.">Import</button>
  <button id="open-player" title="Open the standalone player. Works offline, and opens a .ratlas.json or a DevTools .har.">Player</button>
</header>
<label id="overlay" title="Adds a small control to the corner of the board during a match. It lists cards your opponent revealed and then hid again — only what you were already shown.">
  <input id="overlay-toggle" type="checkbox" role="switch">
  <span class="track" aria-hidden="true"></span>
  <span>Enable In-Game Overlay</span>
</label>
<div id="bar">
  <div>
    <p id="note">Observes only — never sends a game action.</p>
    <div id="tools">
      <button id="dump" title="Everything the recorder holds, for a bug report">Debug dump</button>
      <button id="unstick" title="Forget the room RiftAtlas thinks you are in, and return to the lobby. Use this if it says it cannot reconnect to your game.">Back to lobby</button>
    </div>
  </div>
  <a id="coffee" href="https://www.buymeacoffee.com/eaglevee" target="_blank" rel="noopener"
     aria-label="Support RiftAtlas Replay on Buy Me a Coffee">
    <img src="bmc-logo-dark-ui.svg" alt="" aria-hidden="true">
    <span class="tip" aria-hidden="true">Find it useful? Support is very appreciated!</span></a>
</div>
<input id="search" type="search" placeholder="Search room, opponent, legend, date…"
       autocomplete="off" spellcheck="false">
<p id="count" hidden></p>
<ul id="list"><li class="empty">Loading…</li></ul>
<script type="module" src="popup.js"></script>
